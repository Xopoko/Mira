name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows desktop
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Build the desktop wheel
        run: |
          $env:SOURCE_DATE_EPOCH = git log -1 --format=%ct
          python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install the desktop wheel
        run: python -m pip install --no-deps (Get-ChildItem -Path dist -Filter *.whl).FullName
      - name: Check installed dependencies
        run: python -m pip check
      - name: Check installed resources
        run: >-
          python -I -c "from importlib.resources import files;
          from context_operator.providers.fast_intent import FastIntent;
          assert (files('context_operator') / 'assets' / 'icon.svg').is_file();
          assert (files('context_operator.foundations.perception') / 'perception-models.json').is_file();
          assert (files('context_operator.foundations.ranking') / 'model.json').is_file();
          assert FastIntent().classify('click here')[0] == 'click'"
      - name: Run desktop unit tests
        run: python -m unittest discover -s tests
      - name: Run the offscreen desktop smoke test
        run: python scripts/check_desktop_ui.py
      - name: Record Windows release checksums
        if: github.event_name != 'pull_request'
        run: |
          Copy-Item -LiteralPath requirements.lock.txt -Destination dist
          Get-ChildItem -Path 'dist/*.whl', 'dist/requirements.lock.txt' -File |
            Sort-Object Name |
            ForEach-Object {
              "$((Get-FileHash -LiteralPath $_.FullName).Hash.ToLowerInvariant())  $($_.Name)"
            } |
            Set-Content -LiteralPath dist/SHA256SUMS -Encoding ascii
      - name: Retain the tested Windows wheel and lock file
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mira-windows-release
          path: |
            dist/*.whl
            dist/requirements.lock.txt
            dist/SHA256SUMS
          if-no-files-found: error

  ios:
    name: iPhone companion
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build for iPhone without signing
        run: python3 scripts/check_phone_build.py
      - name: Test the Wi-Fi transport on loopback
        run: python3 scripts/check_phone_native.py
      - name: Run iPhone simulator unit tests
        working-directory: phone
        run: |
          xcodegen generate
          xcodebuild test \
            -project MyEyeTrackingPhone.xcodeproj \
            -scheme MyEyeTrackingPhone \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -derivedDataPath "$RUNNER_TEMP/MiraDerivedData" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
