name: Feature request
description: Suggest a change to Mira.
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: Describe the task and where you get stuck.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What would help?
      description: Include the platform or input method if it matters.
