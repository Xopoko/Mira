name: MyEyeTrackingPhone
options:
  bundleIdPrefix: local.myeyetracking
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    PUBLIC_HEADERS_FOLDER_PATH: include
targets:
  MyEyeTrackingPhone:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.myeyetracking.phone
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 9
        MARKETING_VERSION: 0.3.5
  MyEyeTrackingPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MyEyeTrackingPhone
schemes:
  MyEyeTrackingPhone:
    build:
      targets:
        MyEyeTrackingPhone: all
    test:
      gatherCoverageData: false
      targets:
        - MyEyeTrackingPhoneTests
